name: Build
on:
  push:
    paths-ignore:
      - "assets/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
    branches:
      - "main"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # The build and test job only reads the repository. Anything wider (for
  # example `actions: write`, which can cancel runs and delete artifacts) is a
  # privilege the CI job never needs.
  contents: read

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: ./build.sh --skip-pnpm-prune

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # The cache action exchanges an OIDC token with FlakeHub; the GitHub
      # Actions cache it also uses is reached with the runtime token, so no
      # `actions: write` is needed here either.
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Install Nix
        # v23
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          determinate: true

      - name: Cache Nix store
        # v15
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7

      - name: Check flake inputs
        # v14
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520

      - name: Check flake outputs
        run: nix flake check
